kind = "slides"
previewPath = "/tradora-sops/"
title = "Tradora SOPs"
version = "1.0.0"
id = "artifacts/tradora-sops"
router = "path"

[[services]]
name = "web"
paths = [ "/tradora-sops/" ]
localPort = 20131

[services.development]
run = "pnpm --filter @workspace/tradora-sops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tradora-sops", "run", "build" ]
serve = "static"
publicDir = "artifacts/tradora-sops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20131"
BASE_PATH = "/tradora-sops/"
